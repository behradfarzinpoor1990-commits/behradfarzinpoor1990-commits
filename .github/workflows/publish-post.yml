name: Publish Post

on:
  workflow_dispatch:
    inputs:
      title:
        description: "عنوان مطلب"
        required: true
        type: string

      category:
        description: "دسته‌بندی"
        required: true
        type: string

      content:
        description: "متن مطلب"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت فایل‌های سایت
        uses: actions/checkout@v4

      - name: ساخت مطلب
        env:
          POST_TITLE: ${{ inputs.title }}
          POST_CATEGORY: ${{ inputs.category }}
          POST_CONTENT: ${{ inputs.content }}
        run: |
          mkdir -p posts

          cat > "posts/post-${{ github.run_number }}.html" <<EOF
          <!doctype html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>${POST_TITLE}</title>
          </head>
          <body>
            <main>
              <small>${POST_CATEGORY}</small>
              <h1>${POST_TITLE}</h1>
              <p>${POST_CONTENT}</p>
            </main>
          </body>
          </html>
          EOF

      - name: ذخیره در GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posts/
          git commit -m "Publish new post"
          git push
